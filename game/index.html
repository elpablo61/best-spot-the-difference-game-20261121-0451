<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Lanterns — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="wrap">
  <header id="hud">
    <div class="hud-left">
      <h1>Twin Lanterns</h1>
      <span id="scene-name">Lantern Night Market</span>
    </div>
    <div class="hud-mid">
      <div class="stat"><span class="label">Found</span><span id="found-count">0 / 7</span></div>
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Combo</span><span id="combo">×1</span></div>
    </div>
    <div class="hud-right">
      <div class="stat"><span class="label">Time</span><span id="timer">90</span></div>
      <div class="stat"><span class="label">Hearts</span><span id="hearts">♥♥♥</span></div>
      <button id="hint-btn" type="button">Hint (H) · 3 left</button>
      <button id="sound-btn" type="button" aria-label="Toggle sound">♪</button>
    </div>
  </header>
  <main id="boards">
    <section class="panel" id="panel-left">
      <div class="panel-tag">A · Original</div>
      <canvas id="canvas-left" width="560" height="420"></canvas>
    </section>
    <section class="panel" id="panel-right">
      <div class="panel-tag">B · Changed</div>
      <canvas id="canvas-right" width="560" height="420"></canvas>
    </section>
  </main>
  <div id="progress">
    <div id="progress-fill"></div>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="overlay" class="hidden">
    <div id="overlay-card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div id="overlay-stats"></div>
      <button id="overlay-btn" type="button"></button>
    </div>
  </div>
  <footer id="foot">
    Click a difference on either picture · <kbd>H</kbd> hint · <kbd>N</kbd> next level ·
    <kbd>M</kbd> sound · <kbd>R</kbd> restart level · 5 scenes, 7 differences each
  </footer>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
